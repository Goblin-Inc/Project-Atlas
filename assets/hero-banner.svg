<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <radialGradient id="bg-nebula" cx="30%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#31386b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#11152c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070912" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#070912"/>
  <rect width="1200" height="320" rx="18" fill="url(#bg-nebula)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#b4befe" stroke-opacity="0.22"/>

  <!-- Background stars -->
  <g fill="#dbe4ff" opacity="0.35">
    <circle cx="80" cy="54" r="1.3"/><circle cx="195" cy="270" r="1.1"/><circle cx="340" cy="40" r="1.5"/>
    <circle cx="520" cy="285" r="1.2"/><circle cx="670" cy="52" r="1.4"/><circle cx="1090" cy="64" r="1.3"/>
    <circle cx="1140" cy="240" r="1.1"/><circle cx="960" cy="36" r="1.2"/><circle cx="775" cy="280" r="1.4"/>
  </g>

  <!-- Right-side mini constellation graphic -->
  <g transform="translate(860, 160)">
    <!-- White structural rays -->
    <g stroke="#ebf0ff" stroke-opacity="0.4" stroke-width="1.4">
      <line x1="0" y1="0" x2="-95" y2="-65"/>
      <line x1="0" y1="0" x2="110" y2="-50"/>
      <line x1="0" y1="0" x2="90" y2="75"/>
      <line x1="0" y1="0" x2="-115" y2="55"/>
      <line x1="110" y1="-50" x2="195" y2="-95"/>
      <line x1="110" y1="-50" x2="215" y2="-10"/>
      <line x1="90" y1="75" x2="185" y2="105"/>
      <line x1="-95" y1="-65" x2="-175" y2="-100"/>
    </g>
    <!-- Golden dependency ray -->
    <path d="M -95 -65 Q 50 -115 215 -10" fill="none" stroke="#facc15" stroke-width="2.4" filter="url(#glow)"/>
    <path d="M -115 55 Q 35 120 185 105" fill="none" stroke="#2dd4bf" stroke-width="2" filter="url(#glow)"/>

    <!-- Core star -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#b4befe" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="16" fill="#161b33" stroke="#e4e6f8" stroke-width="2.4" filter="url(#glow)"/>

    <!-- Folder & File stars -->
    <circle cx="110" cy="-50" r="11" fill="#23284a" stroke="#b4befe" stroke-width="1.8"/>
    <circle cx="90" cy="75" r="11" fill="#23284a" stroke="#b4befe" stroke-width="1.8"/>
    <circle cx="-95" cy="-65" r="8" fill="#facc15" filter="url(#glow)"/>
    <circle cx="-115" cy="55" r="7.5" fill="#74c7ec"/>
    <circle cx="195" cy="-95" r="7" fill="#a6e3a1"/>
    <circle cx="215" cy="-10" r="8.5" fill="#f38ba8" filter="url(#glow)"/>
    <circle cx="185" cy="105" r="7.5" fill="#cba6f7"/>
    <circle cx="-175" cy="-100" r="6.5" fill="#fab387"/>
  </g>

  <!-- Title & Tagline -->
  <text x="64" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="52" font-weight="800" fill="url(#title-grad)">✦ Project Atlas</text>
  <text x="66" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#cdd6f4">Explore any codebase as a living 60 FPS constellation universe.</text>
  <text x="66" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b90b2">Progressive Disclosure · Golden Dependency Rays · 4 Lenses · Ctrl+K Teleport · Zero Backend</text>

  <!-- Feature Pills -->
  <g transform="translate(66, 236)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="128" height="30" rx="8" fill="#1e2340" stroke="#b4befe" stroke-opacity="0.45"/>
    <text x="64" y="19" text-anchor="middle" fill="#e4e6f8">🌌 60 FPS Canvas</text>

    <rect x="140" y="0" width="136" height="30" rx="8" fill="#292313" stroke="#facc15" stroke-opacity="0.55"/>
    <text x="208" y="19" text-anchor="middle" fill="#fef08a">⚡ Golden Rays</text>

    <rect x="288" y="0" width="132" height="30" rx="8" fill="#12272a" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="354" y="19" text-anchor="middle" fill="#99f6e4">🐙 GitHub + CLI</text>

    <rect x="432" y="0" width="110" height="30" rx="8" fill="#1e2340" stroke="#cba6f7" stroke-opacity="0.45"/>
    <text x="487" y="19" text-anchor="middle" fill="#e4e6f8">🌐 EN / RU</text>
  </g>
</svg>
